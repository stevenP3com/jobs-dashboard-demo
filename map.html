<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map — Phase 3 Field Jobs (Demo)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .tool { position: relative; flex: 1; min-height: 0; }
  #bigmap { position: absolute; inset: 0; }
  .map-note { padding: 20px; color: var(--text-muted); }

  /* Floating glass panels — inset from edges, rounded, slightly transparent */
  .panel {
    position: absolute; z-index: 800;
    background: rgba(252, 252, 251, 0.88);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .14);
    display: flex; flex-direction: column; min-height: 0;
  }
  @media (prefers-color-scheme: dark) {
    .panel { background: rgba(26, 26, 25, 0.86); }
  }
  .panel h2 { font-size: 13px; font-weight: 650; margin: 0; padding: 12px 14px 6px; }
  .panel .sub { font-size: 11.5px; color: var(--text-muted); margin: 0; padding: 0 14px 8px; }
  .panel-head { display: flex; align-items: flex-start; }
  .panel-head .spacer { margin-left: auto; }
  .icon-btn {
    font: inherit; font-size: 15px; line-height: 1; color: var(--text-muted);
    background: none; border: none; cursor: pointer; padding: 10px 12px;
  }
  .icon-btn:hover { color: var(--text-primary); }

  .panel-left { top: 12px; left: 12px; bottom: 12px; width: 300px; max-width: calc(100vw - 24px); }
  .searchbox { padding: 0 14px 10px; display: grid; gap: 8px; }
  .searchbox input[type=search] { width: 100%; background: var(--surface-1); }
  .searchbox .row { display: flex; gap: 6px; }
  .searchbox select { flex: 1; min-width: 0; font-size: 12px; background: var(--surface-1); }
  .result-count { font-size: 11.5px; color: var(--text-muted); padding: 0 14px 6px; }
  #job-list { overflow-y: auto; min-height: 0; border-top: 1px solid var(--grid); border-radius: 0 0 14px 14px; }
  .panel-left.collapsed #job-list, .panel-left.collapsed .result-count { display: none; }
  .panel-left.collapsed { bottom: auto; }

  .job-item { display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: none; border: none; border-bottom: 1px solid var(--grid);
    padding: 10px 14px; color: var(--text-secondary); }
  .job-item:hover { background: rgba(137, 135, 129, 0.12); }
  .job-item.selected { background: rgba(137, 135, 129, 0.12); box-shadow: inset 3px 0 0 var(--brand); }
  .job-item .l1 { display: flex; gap: 8px; align-items: baseline; }
  .job-item .jid { font-weight: 650; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .job-item .client { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-item .desc { font-size: 12px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-item .meta { font-size: 11.5px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }

  /* Details panel — hidden until a job is selected */
  .panel-right { top: 12px; right: 12px; width: 340px; max-width: calc(100vw - 24px);
    max-height: calc(100% - 24px);
    opacity: 0; pointer-events: none; transform: translateX(14px);
    transition: opacity .16s ease, transform .16s ease; }
  .panel-right.open { opacity: 1; pointer-events: auto; transform: none; }
  .detail { padding: 0 14px 14px; overflow-y: auto; min-height: 0; }
  .detail .jid { font-size: 17px; font-weight: 700; }
  .detail .client-line { display: flex; align-items: center; gap: 7px; margin: 2px 0 10px; color: var(--text-secondary); flex-wrap: wrap; }
  .status-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 99px; padding: 2px 9px; color: var(--text-secondary); }
  .fieldlist { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 12.5px; margin: 0 0 4px; }
  .fieldlist dt { color: var(--text-muted); }
  .fieldlist dd { margin: 0; color: var(--text-secondary); overflow-wrap: anywhere; }
  .detail h3 { font-size: 12px; font-weight: 650; margin: 14px 0 6px; color: var(--text-primary);
    border-top: 1px solid var(--grid); padding-top: 12px; }
  textarea.notes { width: 100%; min-height: 72px; resize: vertical; background: var(--surface-1); }
  .notes-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .docs { display: grid; gap: 6px; }
  .doc { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    text-decoration: none; background: var(--surface-1); }
  .doc:hover { border-color: var(--text-muted); }
  .doc .icon { width: 26px; height: 26px; border-radius: 6px; background: var(--page);
    border: 1px solid var(--border); display: grid; place-items: center;
    font-size: 9px; font-weight: 700; color: var(--brand); flex: none; }
  .doc .kind { margin-left: auto; font-size: 11px; color: var(--text-muted); }
  button.add-doc { margin-top: 8px; width: 100%; font: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--brand); background: none; border: 1px dashed var(--brand);
    border-radius: 8px; padding: 8px; cursor: pointer; }

  /* Small screens: list overlays the top, details slide up from the bottom */
  @media (max-width: 700px) {
    .panel-left { top: 10px; left: 10px; right: 10px; width: auto; bottom: auto; max-height: 55%; }
    .panel-right { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto;
      max-height: 62%; transform: translateY(14px); }
    .panel-right.open { transform: none; }
  }
</style>
</head>
<body>
<div class="tool">
  <div id="bigmap"></div>

  <aside class="panel panel-left" id="left-panel">
    <div class="panel-head">
      <div>
        <h2>Jobs</h2>
        <p class="sub" id="scope-line"></p>
      </div>
      <span class="spacer"></span>
      <button class="icon-btn" id="toggle-list" type="button" aria-expanded="true" aria-label="Collapse job list" title="Collapse job list">▾</button>
    </div>
    <div class="searchbox">
      <input type="search" id="q" placeholder="Search job #, customer, keyword…" aria-label="Search jobs">
      <div class="row">
        <select id="f-status" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="In Progress">In progress</option>
          <option value="Scheduled">Scheduled</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="f-client" aria-label="Filter by customer"><option value="all">All customers</option></select>
      </div>
    </div>
    <div class="result-count" id="count"></div>
    <div id="job-list"></div>
  </aside>

  <aside class="panel panel-right" id="detail-panel" aria-hidden="true">
    <div class="panel-head">
      <h2 id="detail-title">Job details</h2>
      <span class="spacer"></span>
      <button class="icon-btn" id="close-detail" type="button" aria-label="Close job details" title="Close">✕</button>
    </div>
    <div class="detail" id="detail"></div>
  </aside>
</div>

<div id="tooltip" role="status"></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";

/* ---------- "Auth" (demo only) ---------- */
const user = renderP3Header("map");
if (!user) location.replace("index.html");
const userId = new URLSearchParams(location.search).get("user");
const userJobs = user && user.manager ? JOBS : JOBS.filter(j => j.pm === userId);
document.getElementById("scope-line").textContent = user && user.manager
  ? "All PMs · " + userJobs.length + " jobs"
  : (user ? user.name : "") + "’s jobs only · " + userJobs.length + " jobs";

const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
const mode = () => (darkMode.matches ? "dark" : "light");
const clientFill = c => (CLIENT_COLORS[c] ? CLIENT_COLORS[c][mode()] : OTHER_COLOR[mode()]);
/* Touch devices have no hover — taps would pin the summary tooltip on screen,
   so hover summaries are desktop-only. */
const TOUCH_UI = window.matchMedia("(hover: none), (pointer: coarse)").matches;

/* ---------- Left panel collapse (starts collapsed on small screens) ---------- */
const leftPanel = document.getElementById("left-panel");
const toggleBtn = document.getElementById("toggle-list");
function setCollapsed(collapsed) {
  leftPanel.classList.toggle("collapsed", collapsed);
  toggleBtn.setAttribute("aria-expanded", String(!collapsed));
  toggleBtn.textContent = collapsed ? "▸" : "▾";
  toggleBtn.title = toggleBtn.ariaLabel = (collapsed ? "Expand" : "Collapse") + " job list";
}
toggleBtn.addEventListener("click", () => setCollapsed(!leftPanel.classList.contains("collapsed")));
if (window.matchMedia("(max-width: 700px)").matches) setCollapsed(true);

/* ---------- Toast ---------- */
const toast = document.getElementById("toast");
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
}

/* ---------- Tooltip ---------- */
const tooltip = document.getElementById("tooltip");
function showTooltip(x, y, lines) {
  tooltip.replaceChildren();
  lines.forEach(([cls, text]) => {
    const d = document.createElement("div");
    d.className = cls; d.textContent = text;
    tooltip.appendChild(d);
  });
  tooltip.style.display = "block";
  const pad = 14, r = tooltip.getBoundingClientRect();
  tooltip.style.left = Math.min(x + pad, window.innerWidth - r.width - 8) + "px";
  tooltip.style.top  = Math.min(y + pad, window.innerHeight - r.height - 8) + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

/* ---------- Search & filters ---------- */
const elQ = document.getElementById("q");
const elStatus = document.getElementById("f-status");
const elClient = document.getElementById("f-client");
[...new Set(userJobs.map(j => j.client))].sort().forEach(c => {
  const o = document.createElement("option"); o.value = c; o.textContent = c;
  elClient.appendChild(o);
});

function visibleJobs() {
  const q = elQ.value.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  return userJobs.filter(j => {
    if (elStatus.value !== "all" && j.status !== elStatus.value) return false;
    if (elClient.value !== "all" && j.client !== elClient.value) return false;
    if (terms.length) {
      const hay = [j.job_number, j.bid_number, j.client, j.customer_pm, j.description,
                   j.city, j.status, PMS[j.pm] ? PMS[j.pm].name : j.pm].join(" ").toLowerCase();
      if (!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });
}

/* ---------- Map ---------- */
let map, markerLayer;
const markersById = new Map();
const hasLeaflet = () => typeof L !== "undefined";
function initMap() {
  if (!hasLeaflet()) {
    const note = document.createElement("p");
    note.className = "map-note";
    note.textContent = "Map unavailable — the map CDN could not be reached. Use the jobs list to browse jobs.";
    note.style.position = "absolute";
    note.style.inset = "40% 20px auto";
    note.style.textAlign = "center";
    document.getElementById("bigmap").replaceWith(note);
    return;
  }
  map = L.map("bigmap", {
    zoomControl: false, minZoom: 5.4,
    maxBounds: [[31.6, -126.5], [42.8, -112.6]], maxBoundsViscosity: 1.0
  }).setView([37.7, -122.2], 9);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 19, subdomains: "abcd",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function baseStyle(j) {
  return { radius: 8, weight: 3, color: STATUS_BORDER[j.status] || "#898781",
           fillColor: clientFill(j.client), fillOpacity: 1 };
}
function selectedStyle(j) {
  return { radius: 12, weight: 4, color: STATUS_BORDER[j.status] || "#898781",
           fillColor: clientFill(j.client), fillOpacity: 1 };
}

function jobTooltipLines(j) {
  const pmName = PMS[j.pm] ? PMS[j.pm].name : j.pm;
  const lines = [
    ["tt-value", j.job_number + " — " + j.client],
    ["tt-label", j.description],
    ["tt-extra", j.status + (j.pct_complete != null && j.status === "In Progress" ? " (" + j.pct_complete + "%)" : "") +
                 " · " + j.city + " · PM " + pmName + " · " + j.date]
  ];
  return lines;
}

function multiPinIcon(g) {
  const fills = new Set(g.jobs.map(j => clientFill(j.client)));
  const fill = fills.size === 1 ? [...fills][0] : OTHER_COLOR[mode()];
  const borders = new Set(g.jobs.map(j => STATUS_BORDER[j.status] || "#898781"));
  const border = borders.size === 1 ? [...borders][0] : (mode() === "dark" ? "#ffffff" : "#0b0b0b");
  const sel = g.jobs.some(j => j.job_number === selectedId);
  return L.divIcon({
    className: "", iconSize: [32, 32], iconAnchor: [16, 16],
    html: `<div class="multi-pin${sel ? " selected" : ""}" style="background:${fill};border-color:${border}">${g.jobs.length}</div>`
  });
}

function openGroupChooser(g) {
  const div = document.createElement("div");
  div.className = "popup-jobs";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = g.jobs.length + " jobs at this location";
  div.appendChild(title);
  g.jobs.forEach(j => {
    const b = document.createElement("button");
    b.className = "popup-job"; b.type = "button";
    const jid = document.createElement("span"); jid.className = "jid"; jid.textContent = j.job_number;
    b.append(jid, document.createTextNode(j.client + " · " + j.status));
    b.addEventListener("click", () => { map.closePopup(); selectJob(j.job_number, "map-group"); });
    div.appendChild(b);
  });
  L.popup({ offset: [0, -14] }).setLatLng([g.lat, g.lng]).setContent(div).openOn(map);
}

const routesById = new Map();
function routeStyle(j, selected) {
  return { color: clientFill(j.client), weight: selected ? 6 : 3.5,
           opacity: selected ? 1 : 0.75 };
}

function renderMap(jobs, fit) {
  if (!hasLeaflet()) return;
  markerLayer.clearLayers();
  markersById.clear();
  routesById.clear();
  const pts = [];
  // Fiber run polylines first so pins draw above them
  jobs.filter(j => j.route && j.route.length > 1).forEach(j => {
    const line = L.polyline(j.route, routeStyle(j, j.job_number === selectedId));
    if (!TOUCH_UI) {
      line.on("mouseover mousemove", e =>
        showTooltip(e.originalEvent.clientX, e.originalEvent.clientY, jobTooltipLines(j)));
      line.on("mouseout", hideTooltip);
    }
    line.on("click", () => selectJob(j.job_number, "map"));
    line.addTo(markerLayer);
    routesById.set(j.job_number, { line, job: j });
    j.route.forEach(p => pts.push(p));
  });
  groupByLocation(jobs).forEach(g => {
    pts.push([g.lat, g.lng]);
    if (g.jobs.length === 1) {
      const j = g.jobs[0];
      const m = L.circleMarker([j.lat, j.lng], j.job_number === selectedId ? selectedStyle(j) : baseStyle(j));
      if (!TOUCH_UI) {
        m.on("mouseover mousemove", e =>
          showTooltip(e.originalEvent.clientX, e.originalEvent.clientY, jobTooltipLines(j)));
        m.on("mouseout", hideTooltip);
      }
      m.on("click", () => selectJob(j.job_number, "map"));   // clicking again toggles closed
      m.addTo(markerLayer);
      markersById.set(j.job_number, { kind: "single", marker: m, job: j });
    } else {
      const m = L.marker([g.lat, g.lng], { icon: multiPinIcon(g) });
      if (!TOUCH_UI) {
        m.on("mouseover mousemove", e => {
          const lines = [["tt-value", g.jobs.length + " jobs at this location"]];
          g.jobs.slice(0, 4).forEach(j => lines.push(["tt-label", j.job_number + " — " + j.client + " · " + j.status]));
          if (g.jobs.length > 4) lines.push(["tt-extra", "+ " + (g.jobs.length - 4) + " more…"]);
          lines.push(["tt-extra", "Click to pick a job"]);
          showTooltip(e.originalEvent.clientX, e.originalEvent.clientY, lines);
        });
        m.on("mouseout", hideTooltip);
      }
      m.on("click", () => { hideTooltip(); openGroupChooser(g); });
      m.addTo(markerLayer);
      g.jobs.forEach(j => markersById.set(j.job_number, { kind: "multi", marker: m, group: g }));
    }
  });
  if (fit && pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
}

/* ---------- Jobs list ---------- */
function renderList(jobs) {
  const list = document.getElementById("job-list");
  list.replaceChildren();
  const sorted = [...jobs].sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("count").textContent =
    sorted.length + " job" + (sorted.length !== 1 ? "s" : "") + " · newest first";
  sorted.forEach(j => {
    const b = document.createElement("button");
    b.className = "job-item" + (j.job_number === selectedId ? " selected" : "");
    b.dataset.id = j.job_number;
    const l1 = document.createElement("div"); l1.className = "l1";
    const jid = document.createElement("span"); jid.className = "jid"; jid.textContent = j.job_number;
    const cl = document.createElement("span"); cl.className = "client"; cl.textContent = j.client;
    l1.append(jid, cl);
    const desc = document.createElement("div"); desc.className = "desc"; desc.textContent = j.description;
    const meta = document.createElement("div"); meta.className = "meta";
    const ring = document.createElement("span");
    ring.className = "key-ring";
    ring.style.borderColor = STATUS_BORDER[j.status] || "#898781";
    ring.style.background = clientFill(j.client);
    const pct = j.status === "In Progress" && j.pct_complete != null ? " · " + j.pct_complete + "%" : "";
    meta.append(ring, document.createTextNode(j.status + pct + " · " + j.city + " · " + j.date));
    b.append(l1, desc, meta);
    b.addEventListener("click", () => selectJob(j.job_number, "list"));   // clicking again toggles closed
    list.appendChild(b);
  });
  if (!sorted.length) {
    const p = document.createElement("p");
    p.className = "sub"; p.style.padding = "10px 14px";
    p.textContent = "No jobs match this search.";
    list.appendChild(p);
  }
}

/* ---------- Details panel (opens on select, toggles closed) ---------- */
const NOTES = {};   // session-scoped note storage
let selectedId = null;
const detailPanel = document.getElementById("detail-panel");
document.getElementById("close-detail").addEventListener("click", () => selectJob(null));

function renderDetail(j) {
  detailPanel.classList.toggle("open", !!j);
  detailPanel.setAttribute("aria-hidden", String(!j));
  const det = document.getElementById("detail");
  det.replaceChildren();
  if (!j) return;

  const jid = document.createElement("div"); jid.className = "jid"; jid.textContent = j.job_number;
  const cline = document.createElement("div"); cline.className = "client-line";
  const dot = document.createElement("span"); dot.className = "key-dot";
  dot.style.background = clientFill(j.client);
  const chip = document.createElement("span"); chip.className = "status-chip";
  const ring = document.createElement("span");
  ring.className = "key-ring";
  ring.style.borderColor = STATUS_BORDER[j.status] || "#898781";
  ring.style.background = clientFill(j.client);
  chip.append(ring, document.createTextNode(j.status));
  cline.append(dot, document.createTextNode(j.client), chip);
  const copy = document.createElement("button");
  copy.className = "btn-sm"; copy.type = "button"; copy.textContent = "Copy link";
  copy.addEventListener("click", () => {
    navigator.clipboard.writeText(location.href)
      .then(() => showToast("Job link copied to clipboard."))
      .catch(() => showToast("Copy this page’s URL to share the job."));
  });
  cline.appendChild(copy);
  det.append(jid, cline);

  if (j.pct_complete != null) {
    const wrap = document.createElement("div"); wrap.className = "pct-cell";
    wrap.style.marginBottom = "10px";
    const bar = document.createElement("span"); bar.className = "progress";
    const fill = document.createElement("span"); fill.className = "fill";
    fill.style.width = j.pct_complete + "%";
    bar.appendChild(fill);
    const num = document.createElement("span"); num.className = "num";
    num.textContent = j.pct_complete + "%";
    wrap.append(bar, num);
    det.appendChild(wrap);
  }

  const dl = document.createElement("dl"); dl.className = "fieldlist";
  const pmName = PMS[j.pm] ? PMS[j.pm].name : j.pm;
  [["Description", j.description], ["Phase 3 PM", pmName], ["Customer PM", j.customer_pm],
   ["Bid #", j.bid_number], ["Contract", fmtMoney(j.contract_amount) + (j.contract_amount == null ? " (T&M)" : "")],
   ["Est. cost", fmtMoney(j.estimated_job_cost)],
   ["Prevailing wage", j.prevailing_wage ? "Yes" : "No"],
   ["City", j.city], ["Start date", j.date],
   ["Coordinates", j.lat.toFixed(4) + ", " + j.lng.toFixed(4)],
   ["Latest comment", j.latest_comment || "—"]].forEach(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  });
  det.appendChild(dl);

  const h3n = document.createElement("h3"); h3n.textContent = "Notes";
  const ta = document.createElement("textarea");
  ta.className = "notes"; ta.placeholder = "Add a note about this job…";
  ta.value = NOTES[j.job_number] || "";
  ta.addEventListener("input", () => { NOTES[j.job_number] = ta.value; });
  const hint = document.createElement("div"); hint.className = "notes-hint";
  hint.textContent = "Notes are saved for this browser session.";
  det.append(h3n, ta, hint);

  const h3d = document.createElement("h3"); h3d.textContent = "Documents";
  det.appendChild(h3d);
  const docs = document.createElement("div"); docs.className = "docs";
  docsFor(j).forEach(d => {
    const a = document.createElement("a");
    a.className = "doc"; a.href = "#";
    const icon = document.createElement("span"); icon.className = "icon";
    const ext = d.label.includes(".") ? d.label.split(".").pop().toUpperCase() : null;
    icon.textContent = d.kind === "Photos" ? "IMG" : (ext || "DOC").slice(0, 4);
    const name = document.createElement("span"); name.textContent = d.label;
    const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = d.kind;
    a.append(icon, name, kind);
    a.addEventListener("click", e => {
      e.preventDefault();
      showToast("Document preview isn’t available in this demo.");
    });
    docs.appendChild(a);
  });
  det.appendChild(docs);
  const add = document.createElement("button");
  add.className = "add-doc"; add.type = "button"; add.textContent = "+ Add document";
  add.addEventListener("click", () => showToast("Uploads aren’t available in this demo."));
  det.appendChild(add);
}

function syncUrl() {
  const params = new URLSearchParams(location.search);
  if (selectedId) params.set("job", selectedId); else params.delete("job");
  history.replaceState(null, "", location.pathname + "?" + params.toString());
}

function selectJob(id, source) {
  hideTooltip();
  if (id !== null && id === selectedId) id = null;   // clicking the selected job closes it
  const j = id ? (userJobs.find(x => x.job_number === id) || null) : null;
  const prev = selectedId;
  selectedId = j ? id : null;
  if (hasLeaflet()) {
    const setPinState = (entry, job, selected) => {
      if (!entry) return;
      if (entry.kind === "single") {
        entry.marker.setStyle(selected ? selectedStyle(job) : baseStyle(job))
                    .setRadius(selected ? 12 : 8);
        if (selected) entry.marker.bringToFront();
      } else {
        const el = entry.marker.getElement();
        const pin = el && el.querySelector(".multi-pin");
        if (pin) pin.classList.toggle("selected", selected);
      }
    };
    const setRouteState = (jobNum, selected) => {
      const r = routesById.get(jobNum);
      if (r) {
        r.line.setStyle(routeStyle(r.job, selected));
        if (selected) r.line.bringToFront();
      }
    };
    if (prev) {
      const pj = userJobs.find(x => x.job_number === prev);
      if (pj && markersById.has(prev)) setPinState(markersById.get(prev), pj, false);
      setRouteState(prev, false);
    }
    if (j) {
      if (markersById.has(selectedId)) setPinState(markersById.get(selectedId), j, true);
      setRouteState(selectedId, true);
      if (source !== "map" && source !== "map-group") map.panTo([j.lat, j.lng]);
    }
  }
  document.querySelectorAll(".job-item").forEach(el =>
    el.classList.toggle("selected", el.dataset.id === selectedId));
  renderDetail(j);
  syncUrl();
}

/* ---------- Wire up ---------- */
function renderAll(fitMap) {
  const jobs = visibleJobs();
  if (selectedId && !jobs.some(j => j.job_number === selectedId)) selectJob(null);
  renderList(jobs);
  renderMap(jobs, fitMap);
}
elQ.addEventListener("input", () => renderAll(false));
elStatus.addEventListener("change", () => renderAll(false));
elClient.addEventListener("change", () => renderAll(false));
darkMode.addEventListener("change", () => {
  renderAll(false);
  renderDetail(userJobs.find(x => x.job_number === selectedId) || null);
});
initMap();
renderAll(true);

/* Deep link: map.html?user=…&job=P3-26-002 opens that job directly */
const linkedJob = new URLSearchParams(location.search).get("job");
if (linkedJob && userJobs.some(j => j.job_number === linkedJob)) {
  selectJob(linkedJob, "link");
  const j = userJobs.find(x => x.job_number === linkedJob);
  if (hasLeaflet() && j) map.setView([j.lat, j.lng], 13);
}
</script>
